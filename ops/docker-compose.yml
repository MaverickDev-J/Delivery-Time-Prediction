services:
  # --- Data Plane ---
  postgres:
    image: postgres:16-alpine
    container_name: deliveriq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: deliveriq
      POSTGRES_PASSWORD: deliveriq_password
      POSTGRES_DB: deliveriq
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deliveriq"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: deliveriq-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Microservices (DB-per-service + Saga Orchestration) ---
  order-service:
    build:
      context: ..
      dockerfile: ops/Dockerfile.service
      args:
        SERVICE_MODULE: services.order.app:app
        SERVICE_PORT: 8001
    container_name: deliveriq-order-service
    restart: unless-stopped
    environment:
      SERVICE_NAME: order-service
      ORDERS_DATABASE_URL: postgresql://deliveriq:deliveriq_password@postgres:5432/orders_db
      REDIS_URL: redis://redis:6379/0
      PORT: 8001
      HOST: 0.0.0.0
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  payment-service:
    build:
      context: ..
      dockerfile: ops/Dockerfile.service
      args:
        SERVICE_MODULE: services.payment.app:app
        SERVICE_PORT: 8002
    container_name: deliveriq-payment-service
    restart: unless-stopped
    environment:
      SERVICE_NAME: payment-service
      PAYMENTS_DATABASE_URL: postgresql://deliveriq:deliveriq_password@postgres:5432/payments_db
      PAYMENT_FAIL_RATE: "0.0"
      PAYMENT_LATENCY_MS: "0"
      PORT: 8002
      HOST: 0.0.0.0
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy

  inventory-service:
    build:
      context: ..
      dockerfile: ops/Dockerfile.service
      args:
        SERVICE_MODULE: services.inventory.app:app
        SERVICE_PORT: 8003
    container_name: deliveriq-inventory-service
    restart: unless-stopped
    environment:
      SERVICE_NAME: inventory-service
      INVENTORY_DATABASE_URL: postgresql://deliveriq:deliveriq_password@postgres:5432/inventory_db
      PORT: 8003
      HOST: 0.0.0.0
    ports:
      - "8003:8003"
    depends_on:
      postgres:
        condition: service_healthy

  orchestrator-service:
    build:
      context: ..
      dockerfile: ops/Dockerfile.service
      args:
        SERVICE_MODULE: services.orchestrator.app:app
        SERVICE_PORT: 8004
    container_name: deliveriq-orchestrator-service
    restart: unless-stopped
    environment:
      SERVICE_NAME: orchestrator-service
      SAGA_DATABASE_URL: postgresql://deliveriq:deliveriq_password@postgres:5432/saga_db
      PAYMENT_SERVICE_URL: http://payment-service:8002
      INVENTORY_SERVICE_URL: http://inventory-service:8003
      ETA_SERVICE_URL: http://eta-service:8000
      ORDER_SERVICE_URL: http://order-service:8001
      PORT: 8004
      HOST: 0.0.0.0
    ports:
      - "8004:8004"
    depends_on:
      postgres:
        condition: service_healthy
      payment-service:
        condition: service_started
      inventory-service:
        condition: service_started
      eta-service:
        condition: service_started

  # --- ML Inference Service ---
  eta-service:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: deliveriq-eta-service
    restart: unless-stopped
    environment:
      SERVICE_NAME: eta-service
      PORT: 8000
      HOST: 0.0.0.0
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy

  # --- ML Monitoring Service ---
  monitoring-service:
    build:
      context: ..
      dockerfile: ops/Dockerfile.service
      args:
        SERVICE_MODULE: services.monitoring.app:app
        SERVICE_PORT: 8006
    container_name: deliveriq-monitoring-service
    restart: unless-stopped
    environment:
      SERVICE_NAME: monitoring-service
      MONITORING_DB_URL: postgresql://deliveriq:deliveriq_password@postgres:5432/monitoring_db
      PORT: 8006
      HOST: 0.0.0.0
    ports:
      - "8006:8006"
    depends_on:
      postgres:
        condition: service_healthy

  # --- Notifier Stream Consumer ---
  notifier-service:
    build:
      context: ..
      dockerfile: ops/Dockerfile.service
      args:
        SERVICE_MODULE: services.notifier.app:app
        SERVICE_PORT: 8007
    container_name: deliveriq-notifier-service
    restart: unless-stopped
    environment:
      SERVICE_NAME: notifier-service
      PORT: 8007
      HOST: 0.0.0.0
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8007:8007"
    depends_on:
      redis:
        condition: service_healthy

  # --- Observability Stack (profile: obs) ---
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: deliveriq-prometheus
    restart: unless-stopped
    profiles: ["obs"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:11.1.0
    container_name: deliveriq-grafana
    restart: unless-stopped
    profiles: ["obs"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: deliveriq
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
